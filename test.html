<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Phaser 跳跃示例</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <style>
    body { margin: 0; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script>
    const config = {
      type: Phaser.AUTO,
      width: 800,
      height: 600,
      physics: {
        default: 'arcade',
        arcade: {
          gravity: { y: 800 },    // 向下重力
          debug: false
        }
      },
      scene: {
        preload,
        create,
        update
      }
    };

    const game = new Phaser.Game(config);
    let player, cursors;

    function preload() {
      // 加载一个占位的空白图（推荐放在项目文件夹里）
      this.load.image('blank', 'assets/blank.png');
    }

    function create() {
      // 创建一个平台，供角色站立（可改为 tilemap / group）
      const ground = this.physics.add.staticGroup();
      ground.create(400, 580, 'blank').setScale(160, 1).refreshBody();

      // 创建角色精灵
      player = this.physics.add.sprite(100, 450, 'blank')
        .setScale(0.5)               // 缩小到 50%
        .setCollideWorldBounds(true);

      // 物理碰撞
      this.physics.add.collider(player, ground);

      // 键盘输入
      cursors = this.input.keyboard.createCursorKeys();
    }

    function update() {
      // 左右移动
      if (cursors.left.isDown) {
        player.setVelocityX(-200);
      } else if (cursors.right.isDown) {
        player.setVelocityX(200);
      } else {
        player.setVelocityX(0);
      }

      // 跳跃：只有在接触地面时才能跳
      if (cursors.up.isDown && player.body.blocked.down) {
        player.setVelocityY(-400);
      }
    }
  </script>
</body>
</html>
