<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website under construction</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
    body{display:flex;flex-direction:column;min-height:100vh;background:#f8f9fa}

    /* central display */
    #main-space{margin:40px auto 0;width:80%;height:40%;background:#ffe8cc;border:2px dashed #ffb080;display:flex;align-items:center;justify-content:center;padding:1rem;text-align:center;transition:.3s}

    /* tray – sticks to bottom, centered */
    #card-tray{margin-top:auto;width:100%;display:flex;justify-content:center;gap:40px;padding:20px 0;pointer-events:none}

    .card{width:120px;height:160px;background:#fff;border:1px solid #333;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:transform .25s cubic-bezier(.25,.8,.25,1),box-shadow .25s;cursor:pointer;pointer-events:auto;user-select:none}
    .card:hover{transform:translateY(-20px);box-shadow:0 10px 20px rgba(0,0,0,.15)}
    .card.selected{transform:translateY(-30px);box-shadow:0 14px 24px rgba(0,0,0,.2)}
  </style>
</head>
<body>
  <div id="main-space">Hover &amp; click a card below</div>
  <div id="card-tray"></div>

<script>
// ********* CONFIGURE YOUR CARDS HERE *********
const cardsData=[
  {label:'Card A', content:'<h2>Project A</h2><p>Coming soon…</p>'},
  {label:'Card B', content:'<h2>Project B</h2><a href="#">Visit repo</a>'},
  {label:'Card C', content:'<h2>Project C</h2><p>Details TBD</p>'},
  {label:'Card D', content:'<h2>Project D</h2><p>Placeholder</p>'},
  {label:'Card E', content:'<h2>Project E</h2><p>Link later</p>'}
];
// *********************************************

const tray=document.getElementById('card-tray');
const main=document.getElementById('main-space');

cardsData.forEach(data=>{
  const card=document.createElement('div');
  card.className='card';
  card.textContent=data.label;
  tray.appendChild(card);

  // click handling – show content and mark selected
  card.addEventListener('click',()=>{
    tray.querySelectorAll('.card.selected').forEach(c=>c.classList.remove('selected'));
    card.classList.add('selected');
    main.innerHTML=data.content;
  });
});

// Keyboard sequence detector module
// This module detects when the keys S,K,I,P are pressed sequentially
// When detected, it will redirect to test.html
(function() {
  const targetSequence = ['s', 'k', 'i', 'p'];
  let currentSequence = [];
  
  document.addEventListener('keydown', function(event) {
    // Convert to lowercase to make detection case-insensitive
    const key = event.key.toLowerCase();
    
    // Add the pressed key to current sequence
    currentSequence.push(key);
    
    // If the sequence is longer than target, remove the first element
    if (currentSequence.length > targetSequence.length) {
      currentSequence.shift();
    }
    
    // Check if current sequence matches target
    if (currentSequence.length === targetSequence.length && 
        currentSequence.every((k, i) => k === targetSequence[i])) {
      // Redirect to test page when SKIP is detected
      window.location.href = 'test.html';
    }
  });
})();
</script>
</body>
</html>
