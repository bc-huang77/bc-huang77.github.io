<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的个人站 · My Site</title>

  <!-- ――― 基础样式 ――― -->
  <style>
    :root {
      --accent: #4f8cff;
      --bg: #f7f9fc;
      --text: #222;
      font-size: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: var(--accent);
      color: #fff;
      padding: 1.2rem;
      text-align: center;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      max-width: 680px;
      width: 100%;
      padding: 2.5rem;
      animation: fadeIn 0.6s ease-out;
    }

    h1 { font-size: 2rem; margin-bottom: 0.8rem; }
    p  { margin-bottom: 1.2rem; }
    a.button {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      text-decoration: none;
      transition: transform .15s, box-shadow .15s;
    }
    a.button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.1);
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    footer {
      padding: 1rem 0;
      text-align: center;
      font-size: 0.875rem;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <header>
    <h2>欢迎来到我的个人网站</h2>
  </header>

  <main>
    <section class="card">
      <h1>Hello, GitHub Pages! 👋</h1>
      <p>这里是一段示例文本。你可以在 <code>index.html</code> 里随意修改，
         添加自己的作品集、博客文章或联系方式。</p>
      <p>想了解如何自动部署、绑定自定义域名或使用静态站点生成器？  
         去看看 <a href="https://docs.github.com/pages" target="_blank">GitHub Pages 文档</a>。</p>
      <a class="button" href="https://github.com/你的用户名/你的仓库" target="_blank">查看仓库 →</a>
    </section>
  </main>

  <footer>
    © 2025 Your Name. Built with ♥ on GitHub Pages.
  </footer>
</body>
</html>
